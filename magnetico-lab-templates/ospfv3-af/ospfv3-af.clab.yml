name: ospfv3-af
topology:
  defaults:
    kind: cisco_iol
    image: vrnetlab/cisco_iol:17.18.02

  nodes:
    a: { mgmt-ipv4: 172.20.20.10, mgmt-ipv6: 3fff:172:20:20::10, startup-config: configs/a.cfg }
    b: { mgmt-ipv4: 172.20.20.20, mgmt-ipv6: 3fff:172:20:20::20, startup-config: configs/b.cfg }
    c: { mgmt-ipv4: 172.20.20.30, mgmt-ipv6: 3fff:172:20:20::30, startup-config: configs/c.cfg }
    d: { mgmt-ipv4: 172.20.20.40, mgmt-ipv6: 3fff:172:20:20::40, startup-config: configs/d.cfg }

  links:
    - endpoints: ["a:Ethernet0/1", "b:Ethernet0/1"]
    - endpoints: ["a:Ethernet0/2", "b:Ethernet0/2"]
    - endpoints: ["b:Ethernet0/3", "d:Ethernet0/1"]
    - endpoints: ["b:Ethernet1/0", "c:Ethernet0/1"]
