name: rs-lab12-mpls-ldp-l3vpn
topology:
  defaults:
    kind: cisco_iol
    image: vrnetlab/cisco_iol:17.18.02

  nodes:
    cpe1: { mgmt-ipv4: 172.20.20.10, mgmt-ipv6: 3fff:172:20:20::10, startup-config: configs/cpe1.cfg }
    pe1: { mgmt-ipv4: 172.20.20.20, mgmt-ipv6: 3fff:172:20:20::20, startup-config: configs/pe1.cfg }
    p: { mgmt-ipv4: 172.20.20.30, mgmt-ipv6: 3fff:172:20:20::30, startup-config: configs/p.cfg }
    pe2: { mgmt-ipv4: 172.20.20.40, mgmt-ipv6: 3fff:172:20:20::40, startup-config: configs/pe2.cfg }
    ce2: { mgmt-ipv4: 172.20.20.50, mgmt-ipv6: 3fff:172:20:20::50, startup-config: configs/ce2.cfg }

  links:
    - endpoints: ["cpe1:Ethernet0/1", "pe1:Ethernet0/1"]
    - endpoints: ["pe1:Ethernet0/2", "p:Ethernet0/1"]
    - endpoints: ["p:Ethernet0/2", "pe2:Ethernet0/1"]
    - endpoints: ["pe2:Ethernet0/2", "ce2:Ethernet0/1"]
