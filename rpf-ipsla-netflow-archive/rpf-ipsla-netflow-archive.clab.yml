name: rpf-ipsla-netflow-archive
topology:
  defaults:
    kind: cisco_iol
    image: vrnetlab/cisco_iol:17.18.02
    
  nodes:
    r1: { mgmt-ipv4: 172.20.20.10 }
    r2: { mgmt-ipv4: 172.20.20.20 }
    r3: { mgmt-ipv4: 172.20.20.30 }
    r4: { mgmt-ipv4: 172.20.20.40 }
    
    br-lab09:
      kind: bridge
      
  links:
    - endpoints: ["r1:Ethernet0/1", "r2:Ethernet0/1"]
    - endpoints: ["r1:Ethernet0/2", "r3:Ethernet0/1"]
    - endpoints: ["r2:Ethernet0/2", "br-lab09:r1-lab09"]
    - endpoints: ["r3:Ethernet0/2", "br-lab09:r2-lab09"]
    - endpoints: ["r4:Ethernet0/1", "br-lab09:r3-lab09"]
