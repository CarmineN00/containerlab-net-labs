name: eigrp

topology:
  defaults:
    kind: cisco_iol
    image: vrnetlab/cisco_iol:17.18.02

  nodes:
    r1: { mgmt-ipv4: 172.20.20.10, startup-config: configs/r1.cfg }
    r2: { mgmt-ipv4: 172.20.20.20, startup-config: configs/r2.cfg }
    r3: { mgmt-ipv4: 172.20.20.30, startup-config: configs/r3.cfg }
    r4: { mgmt-ipv4: 172.20.20.40, startup-config: configs/r4.cfg }        
    r5: { mgmt-ipv4: 172.20.20.50, startup-config: configs/r5.cfg }
    r6: { mgmt-ipv4: 172.20.20.60, startup-config: configs/r6.cfg }
    r7: { mgmt-ipv4: 172.20.20.70, startup-config: configs/r7.cfg }
    r8: { mgmt-ipv4: 172.20.20.80, startup-config: configs/r8.cfg }
    r9: { mgmt-ipv4: 172.20.20.90, startup-config: configs/r9.cfg }

    eigrp_br-ma1:
        kind: bridge

  links:
    # EIGRP AS 100 backbone
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "r5:eth1"]

    # Multi-access segment r2 - r3 - r4 via bridge
    - endpoints: ["r2:eth3", "eigrp_br-ma1:eth1"]
    - endpoints: ["r3:eth3", "eigrp_br-ma1:eth2"]
    - endpoints: ["r4:eth1", "eigrp_br-ma1:eth3"]

    # Stub branch site behind r1
    - endpoints: ["r1:eth2", "r6:eth1"]
    - endpoints: ["r6:eth2", "r7:eth1"]

    # Multi-AS boundary
    - endpoints: ["r5:eth3", "r8:eth1"]
    - endpoints: ["r8:eth2", "r9:eth1"]
